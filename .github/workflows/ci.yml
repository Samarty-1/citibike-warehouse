name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Model tests (fixture)
        run: pytest -q tests/test_models.py
      - name: Land six years of trips and weather
        run: python scripts/ingest.py
      - name: Build and run every analysis
        run: python run.py > /dev/null
      - name: Full-data invariant tests
        run: pytest -q tests/test_full_data.py
